name: Feature request
description: An idea that would make the bridge more useful.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public: describe Teams behaviour by its shape, never with real names, ids or
        message text (use Alice, Bob, "Project X" and the like).
        Note the project's limits: data flows one way (computer → FCM → phone), nothing is ever sent
        or typed into Teams, and the phone never talks back to the computer.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work; alternatives you considered.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no real tenant, team, channel, chat or person names, ids or message text.
          required: true
