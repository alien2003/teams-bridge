# CI (D22): lint, Go tests against a real browser on Linux, Windows and macOS (Apple Silicon and
# Intel, D26), Android JVM tests and the debug APK. Every toolchain comes from mise.toml through mise-action, as on the dev PC; each job
# disables the tools it does not need (MISE_DISABLE_TOOLS) and keeps its own mise cache. Caches are
# restored everywhere and written only by pushes to main. No secrets: the APK is built with the
# placeholder google-services.json and a throwaway debug key.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The dev PC's mise (D22); bump the two together.
  MISE_VERSION: "2026.9.17"
  # Caches are written only by pushes to main (pull requests and tags restore them).
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: java,gradle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repo-local temp dir (mise sets TMPDIR=.tmp)
        shell: bash
        run: mkdir -p .tmp
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache_key_prefix: mise-v1-lint
          cache_save: ${{ env.SAVE_CACHE }}
          env: false
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .xdg/go/pkg/mod
            .xdg/cache/go-build
            .xdg/cache/staticcheck
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-lint-${{ runner.os }}-
      - name: gofmt, go vet, staticcheck
        run: mise run lint
      - name: actionlint, zizmor, shellcheck
        run: mise run lint-ci
      - name: Release script tests (version.sh, release-notes.sh)
        run: mise run test-scripts
      - name: Secret patterns and forbidden files (the stop list stays on the dev PC)
        run: mise run secrets-check
        env:
          TBD_NO_DENYLIST: "1"
      - name: Save Go caches
        if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .xdg/go/pkg/mod
            .xdg/cache/go-build
            .xdg/cache/staticcheck
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  go:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, macos-15-intel x86_64: each release binary's architecture
        # runs natively (D26).
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # Git Bash on Windows; on macOS whichever bash is first on the PATH (maybe 3.2)
    env:
      MISE_DISABLE_TOOLS: java,gradle,go:honnef.co/go/tools/cmd/staticcheck,actionlint,zizmor,shellcheck
      # On macOS the windowed login tests (an Aqua session) and the launchd round trips (the user's
      # gui/<uid> domain) must run: a skip there is a failure (D26).
      TBD_REQUIRE_GUI: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
      TBD_REQUIRE_LAUNCHD: ${{ startsWith(matrix.os, 'macos') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repo-local temp dir (mise sets TMPDIR=.tmp)
        shell: bash
        run: mkdir -p .tmp
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache_key_prefix: mise-v1-go
          cache_save: ${{ env.SAVE_CACHE }}
          env: false
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .xdg/go/pkg/mod
            .xdg/cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Browser
        if: runner.os == 'Linux'
        run: microsoft-edge --version # the runner's Edge; on Windows --version would open a window (D7)
      # The runner's preinstalled Edge, found the way users' machines find it (PATH on Linux,
      # Program Files on Windows). TBD_REQUIRE_BROWSER=1 turns a missing browser into a failure.
      # Ubuntu 24.04 runners forbid unprivileged user namespaces through AppArmor, so Chromium falls
      # back to its SUID helper, which the Edge package does not set up there, and aborts. Lifting the
      # restriction keeps the browser's sandbox on (tbd never passes --no-sandbox).
      - name: Allow the browser's user-namespace sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The runner's Edge in /Applications, found as users' Macs find it. Its first start pays
      # Gatekeeper's first-launch scan, which must not eat a test's 30 s DevTools timeout (D25):
      # --version pays it here. The rest is for D26: the Info.plist format tbd reads the version
      # from, whether the job runs in a GUI (Aqua) session, the OS and the architecture.
      - name: Browser (macOS)
        if: runner.os == 'macOS'
        run: |
          app="/Applications/Microsoft Edge.app"
          "$app/Contents/MacOS/Microsoft Edge" --version
          echo "Info.plist: $(head -c 6 "$app/Contents/Info.plist" | LC_ALL=C tr -c '[:print:]' '?')…, CFBundleShortVersionString $(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")"
          echo "launchctl managername: $(launchctl managername)"
          sw_vers
          echo "uname -m: $(uname -m), hw.optional.arm64: $(sysctl -n hw.optional.arm64 2>/dev/null || echo absent)"
      - name: Footprint baseline (macOS)
        if: runner.os == 'macOS'
        run: scripts/ci-mac-footprint.sh before
      - name: go test
        run: mise exec -- bash scripts/test-go.sh
      # What the tests left under ~/Library, in the keychain, in launchd and as processes: paths
      # and counts in the step summary; fails on what must not stay (scripts/ci-mac-footprint.sh).
      - name: Footprint (macOS)
        if: always() && runner.os == 'macOS'
        run: scripts/ci-mac-footprint.sh after
      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-log-${{ runner.os }}-${{ runner.arch }}
          path: .tmp/go-test.log
          include-hidden-files: true # .tmp/ is a dot directory
          retention-days: 7
          if-no-files-found: ignore
      - name: Save Go caches
        if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .xdg/go/pkg/mod
            .xdg/cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_DISABLE_TOOLS: go,go:honnef.co/go/tools/cmd/staticcheck,actionlint,zizmor,shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repo-local temp dir (mise sets TMPDIR=.tmp)
        shell: bash
        run: mkdir -p .tmp
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache_key_prefix: mise-v1-android
          cache_save: ${{ env.SAVE_CACHE }}
          env: false
      - name: Restore the Android SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/android-sdk
          key: android-sdk-${{ hashFiles('scripts/android-sdk.sh') }}
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .xdg/gradle/caches
            .xdg/gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'mise.toml') }}
          restore-keys: gradle-
      - name: JVM unit tests (warnings as errors)
        run: mise exec -- scripts/test-android.sh
      - name: Debug APK (placeholder google-services.json, throwaway debug key)
        run: mise exec -- scripts/build.sh android
      - name: Upload the debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-bridge-debug-apk
          path: dist/teams-bridge-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Save the Android SDK
        if: env.SAVE_CACHE == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/android-sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Save Gradle caches
        if: env.SAVE_CACHE == 'true' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .xdg/gradle/caches
            .xdg/gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
