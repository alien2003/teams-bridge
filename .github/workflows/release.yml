# Release (D23): a pushed tag vX.Y.Z or vX.Y.Z-rc.N builds, attests and publishes a GitHub release
# with teams-bridge.apk (signed by the release key), teams-bridge-mapping.txt.gz, tbd-linux-amd64,
# tbd-windows-amd64.exe and SHA256SUMS. An rc tag (any "-") becomes a prerelease. Jobs:
#   tag      the tag is a release tag (scripts/version.sh) on main; writes the release notes
#   verify   the whole CI (ci.yml as a reusable workflow; restores caches, never saves them on a tag)
#   build    the only job with secrets (environment "release"): scripts/build-release.sh, then SLSA
#            build provenance for every asset; no caches, so nothing a pull request wrote is restored
#   publish  the only job that may write to the repository: creates the release from the artifacts
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The dev PC's mise, as in ci.yml (D22); bump them together.
  MISE_VERSION: "2026.9.17"

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main and the previous tags (release notes)
          persist-credentials: false
      - name: Release tag on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The annotated tag object itself (its message may hold the release notes).
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          vars="$(scripts/version.sh "$TAG")"
          echo "$vars"
          echo "prerelease=$(sed -n 's/^TBD_PRERELEASE=//p' <<<"$vars")" >>"$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .tmp
          scripts/release-notes.sh "$TAG" >.tmp/release-notes.md
          cat .tmp/release-notes.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: .tmp/release-notes.md
          include-hidden-files: true # .tmp/ is a dot directory
          retention-days: 7
          if-no-files-found: error

  verify:
    name: CI
    # A reusable workflow is resolved from the tagged commit when the run is queued, not from the
    # workspace, so "./" cannot pick up anything written at runtime. The "$/" form that zizmor
    # suggests is not accepted by actionlint 1.7.12 yet (rhysd/actionlint#711).
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  build:
    name: Build and attest
    needs: [tag, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation in the repository
    env:
      MISE_DISABLE_TOOLS: go:honnef.co/go/tools/cmd/staticcheck,actionlint,zizmor,shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false
          env: false
      - name: Release assets
        env:
          TBD_RELEASE_TAG: ${{ github.ref_name }}
          TBD_RELEASE_KEYSTORE_B64: ${{ secrets.TBD_RELEASE_KEYSTORE_B64 }}
          TBD_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TBD_RELEASE_KEYSTORE_PASSWORD }}
          TBD_RELEASE_KEY_ALIAS: ${{ secrets.TBD_RELEASE_KEY_ALIAS }}
          TBD_GOOGLE_SERVICES_JSON_B64: ${{ secrets.TBD_GOOGLE_SERVICES_JSON_B64 }}
        run: mise run release-build
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          (cd assets && sha256sum --strict -c SHA256SUMS)
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file notes/release-notes.md "${flags[@]}" \
            assets/teams-bridge.apk assets/teams-bridge-mapping.txt.gz \
            assets/tbd-linux-amd64 assets/tbd-windows-amd64.exe assets/SHA256SUMS
