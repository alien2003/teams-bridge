# Hermetic build settings (BRIEF §1). GRADLE_USER_HOME, ANDROID_HOME, ANDROID_USER_HOME and
# JAVA_TOOL_OPTIONS (java.io.tmpdir, no hsperfdata) come from mise.toml [env].
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:-UsePerfData -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=false
org.gradle.daemon.idletimeout=900000
# Never download or auto-detect other JDKs: the mise-provided JDK 17 is the only toolchain.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin: compile inside the Gradle daemon. The out-of-process Kotlin daemon keeps its own state and
# run files outside the project; in-process has none and is fast enough for one small module.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# Kotlin warnings become errors with -Ptbd.werror=true (scripts/test-android.sh).
tbd.werror=false

# AGP must not download SDK components by itself: scripts/android-sdk.sh installs exactly what the
# build needs (a mismatch fails the build instead of silently growing .tools/android-sdk).
android.builder.sdkDownload=false
# Debug is minified on purpose (APK size, see app/build.gradle.kts); R8 only shrinks debuggable builds.
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED,UNSUPPORTED_PROJECT_OPTION_USE
# No telemetry: KGP otherwise writes build statistics ($GRADLE_USER_HOME/kotlin-profile) for IntelliJ
# to upload. AGP's $ANDROID_USER_HOME/analytics.settings stays at hasOptedIn=false (nothing uploads).
kotlin.internal.collectFUSMetrics=false
